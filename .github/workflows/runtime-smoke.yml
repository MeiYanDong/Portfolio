name: Runtime Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: runtime-smoke-production
  cancel-in-progress: false

jobs:
  runtime-smoke:
    name: runtime-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify deployed revision and routes
        env:
          BASE_URL: https://myandong.xyz
          EXPECTED_REVISION: ${{ github.event_name == 'push' && github.sha || '' }}
        run: npm run smoke:prod
